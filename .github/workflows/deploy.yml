name: Deploy to GitHub Pages

# main へ push するたびにビルドして GitHub Pages へ公開する。
# 手動実行（Actions タブの Run workflow）もできる。
#
# **ここのブランチ名は、実際の既定ブランチと必ず突き合わせること。**
# 姉妹アプリでは main を待つ設定なのに既定ブランチが master で、
# ワークフローが一度も動いていなかった。このリポジトリは `git init` の既定で
# main になっている（`git branch --show-current` で確認）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開中に新しい実行が来ても、進行中のものは最後まで走らせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型チェックとビルド
        run: npm run build

      # ★ enablement: true は効きません（2026 年 9 月 19 日に実測）。
      #
      # Pages サイトの作成（POST /repos/{owner}/{repo}/pages）には admin 権限が要り、
      # ワークフローの GITHUB_TOKEN は pages: write までなので弾かれます。
      #     Create Pages site failed.
      #     Error: Resource not accessible by integration
      # このステップ自体が落ちるので、build は緑にならず deploy は skipped になります。
      #
      # **push の前に、Settings → Pages → Build and deployment → Source を
      # 「GitHub Actions」にしておくこと。**設定したあとは再実行が要ります
      # （設定だけでは走りません。Actions タブの Run workflow か Re-run jobs）。
      #
      # 有効化済みのリポジトリでは、この指定は無害に通ります。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
